<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AM Blackbox{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --crit: #f07178;
      --border: #2a3548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header a { color: var(--accent); text-decoration: none; margin-left: 1rem; }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 0.75rem; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    th { color: var(--muted); font-weight: 600; }
    tr:hover td { background: rgba(61, 156, 240, 0.06); }
    a.rowlink { color: var(--text); text-decoration: none; }
    a.rowlink:hover { color: var(--accent); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .sev-critical, .sev-error { background: rgba(240,113,120,0.2); color: var(--crit); }
    .sev-warning { background: rgba(240,180,41,0.2); color: var(--warn); }
    .sev-info, .sev-warning-low { background: rgba(61,156,240,0.2); color: var(--accent); }
    .st-open { background: rgba(62,207,142,0.15); color: var(--ok); }
    .st-resolved { background: rgba(139,155,180,0.2); color: var(--muted); }
    .badge-oom { background: rgba(240,113,120,0.25); color: var(--crit); }
    .badge-dead { background: rgba(240,113,120,0.35); color: #ffb4b8; }
    .badge-pressure { background: rgba(240,180,41,0.25); color: var(--warn); }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.15rem;
      margin-bottom: 0.75rem;
    }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .empty { color: var(--muted); padding: 2rem; text-align: center; }
    code { background: #0b1016; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85em; }
    pre {
      background: #0b1016;
      padding: 0.75rem;
      border-radius: 6px;
      overflow: auto;
      font-size: 0.8rem;
    }
    .ok { color: var(--ok); }
    .bad { color: var(--crit); }
  </style>
</head>
<body>
  <header>
    <div class="brand">AM Blackbox</div>
    <nav>
      <a href="{% url 'incident_list' %}">Incidents</a>
      <a href="{% url 'health' %}">Health</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
